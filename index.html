<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoonify Selected Area</title>
</head>
<body>
    <h1>Upload an Image & Apply Cartoon Effect to a Specific Area</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="image">Select Image:</label>
        <input type="file" name="image" required><br><br>

        <label for="x">X Coordinate:</label>
        <input type="number" name="x" required><br><br>

        <label for="y">Y Coordinate:</label>
        <input type="number" name="y" required><br><br>

        <label for="w">Width:</label>
        <input type="number" name="w" required><br><br>

        <label for="h">Height:</label>
        <input type="number" name="h" required><br><br>

        <button type="submit">Upload & Cartoonify</button>
    </form>
</body>
</html>
